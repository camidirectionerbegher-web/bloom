<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOOM — Tu tienda favorita</title>
<!-- Aplicar tema guardado ANTES del primer render para evitar flash -->
<script>
  (function(){
    var t = localStorage.getItem("bloom_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #598eff;
  --blue-dark: #3a6fe0;
  --blue-light: #eef2ff;
  --blue-glow: rgba(89,142,255,0.18);
  --bg: #f8f8fc;
  --surface: #ffffff;
  --surface2: #f2f2f8;
  --surface3: #e8e8f2;
  --border: rgba(89,142,255,0.12);
  --border2: rgba(0,0,0,0.07);
  --text: #0f0f1a;
  --text2: #5a5a78;
  --text3: #9898b8;
  --red: #ff4d6d;
  --green: #00c48c;
  --amber: #ffb84d;
  --shadow-sm: 0 2px 8px rgba(89,142,255,0.08);
  --shadow-md: 0 8px 32px rgba(89,142,255,0.12);
  --shadow-lg: 0 20px 60px rgba(89,142,255,0.16);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xl: 22px;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg: #080810;
  --surface: #12121e;
  --surface2: #1a1a2a;
  --surface3: #222236;
  --border: rgba(89,142,255,0.18);
  --border2: rgba(255,255,255,0.06);
  --text: #f0f0ff;
  --text2: #9898b8;
  --text3: #5a5a78;
  --blue-light: #1a1f3a;
  --blue-glow: rgba(89,142,255,0.22);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Figtree', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .3s, color .3s; overflow-x: hidden; cursor: auto; }
/* ── Cursor fix global: nunca desaparece en modales ni drawers ── */
.drawer, .modal, .modal-wrap, .drawer-bd, .drawer-ft, .drawer-hd,
.modal-body, .modal-hd, .overlay, .acc-info-box, .fg,
[class*="modal"], [class*="drawer"] { cursor: auto; }
input, textarea, select { cursor: text !important; }
input[type="checkbox"], input[type="radio"] { cursor: pointer !important; }
button, [role="button"], .nav-btn, .cat-pill, .ship-opt,
.pay-method-opt, .p-wish, .p-quick, .add-to-cart, .qty-btn,
.acc-tab, .acc-avatar, .mo-track-btn, .checkout-btn,
.btn-next, .btn-back, .btn-edit, .btn-del, .drawer-close,
.modal-hd button, select { cursor: pointer !important; }
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOcta[...] ");
  opacity: 0.4;
}
.ann-bar { background: var(--blue); color: #fff; text-align: center; padding: 9px 1rem; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; position: relative; z-index: 10; }
.ann-bar a { color: #fff; text-decoration: underline; cursor: pointer; }
header { background: rgba(255,255,255,0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; transition: background .2s, border-color .2s; }
[data-theme="dark"] header { background: rgba(18,18,30,0.85); }
.nav { max-width: 1320px; margin: auto; padding: 0 2rem; height: 64px; display: flex; align-items: center; gap: 1rem; }
.logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; color: var(--blue); text-decoration: none; flex-shrink: 0; position: relative; display: inline-flex; align-items: center; gap: 8px; }
.logo sup { font-size: 0.45em; color: var(--text3); vertical-align: super; font-family: 'Figtree', sans-serif; font-weight: 400; letter-spacing: 0.06em; }
.logo-flower { width: 22px; height: 22px; flex-shrink: 0; }
.nav-links { display: flex; gap: 1.5rem; margin: 0 1rem; }
.nav-links a { font-size: 0.85rem; font-weight: 500; color: var(--text2); text-decoration: none; transition: color var(--transition); white-space: nowrap; cursor: pointer; }
.nav-links a:hover { color: var(--blue); }
.nav-links a.nav-active { color: var(--blue); font-weight: 700; }
.search-wrap { position: relative; flex: 1; max-width: 340px; margin-left: auto; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); width: 16px; height: 16px; pointer-events: none; }
.search-wrap input { width: 100%; padding: 0.55rem 1rem 0.55rem 2.4rem; border: 1.5px solid var(--border2); border-radius: 99px; background: var(--surface2); color: var(--text); font-family: 'Figtree', sans-serif; }
.search-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-glow); }
.nav-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
.nav-btn { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--border2); background: transparent; color: var(--text2); }
.nav-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.nav-badge { position: absolute; top: -5px; right: -5px; background: var(--blue); color: #fff; font-size: 0.6rem; font-weight: 700; min-width: 17px; height: 17px; border-radius: 99px; display: none; align-items: center; justify-content: center; }
.nav-badge.show { display: flex; }
/* rest of styles omitted for brevity in commit content representation */
</style>
</head>

<div class="ann-bar">
  🌸 Envío gratis en pedidos mayores a $5.000 &nbsp;·&nbsp; Usá el código <strong>BLOOM20</strong> para 20% de descuento &nbsp;·&nbsp; <a onclick="scrollToSection('flash')">Ver ofertas →</a>
</div>

<header>
  <nav class="nav">
    <a class="logo" href="#">
      <svg class="logo-flower" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
        <g transform="translate(20,20)">
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#598eff" opacity="0.95" transform="rotate(0)"/>
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#7aaeff" opacity="0.85" transform="rotate(51.4)"/>
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#598eff" opacity="0.9" transform="rotate(102.8)"/>
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#3a6fe0" opacity="0.85" transform="rotate(154.2)"/>
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#598eff" opacity="0.9" transform="rotate(205.6)"/>
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#7aaeff" opacity="0.85" transform="rotate(257)"/>
          <ellipse cx="0" cy="-9" rx="4" ry="7" fill="#3a6fe0" opacity="0.9" transform="rotate(308.4)"/>
          <circle cx="0" cy="0" r="5" fill="#fff" stroke="#598eff" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="3" fill="#598eff"/>
        </g>
      </svg>
      BLOOM<sup>®</sup>
    </a>
    <div class="nav-links">
      <a onclick="scrollToSection('products')">Productos</a>
      <a onclick="scrollToSection('cats')">Categorías</a>

      <a id="navTrackingLink" onclick="openTrackingModal()">Seguí tu pedido<span id="navTrackingBadge" class="nav-track-badge" style="display:none"></span></a>

    <div class="search-wrap">

      <input type="search" id="searchInput" placeholder="Buscar en BLOOM..." autocomplete="off">

    <div class="nav-actions">
      <button class="nav-btn" id="wishBtn" onclick="toggleWishDrawer()" title="Favoritos">

        <div class="acc-promo-tip" id="accPromoTip" onclick="openAccountModal()">
          <span class="acc-promo-dot"></span>¡Creá tu cuenta y rastreá tus pedidos 🌸
        </div>
        <button class="nav-btn" id="adminNavBtn" onclick="openAdminPanel()" title="Panel Admin" style="display:none;background:rgba(255,77,109,0.1);border-color:rgba(255,77,109,0.3);color:var(--red)">🔧</button>
      </div>
      <button class="nav-btn" onclick="toggleTheme()" id="themeBtn" title="Tema">🌙</button>
    </div>
  </nav>
</header>
