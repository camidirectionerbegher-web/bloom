<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">

<title>Página no encontrada — Alicia en el País</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#c0392b; --red-dark:#8f2a1f; --amber:#e0961e; --blue:#3f7ca6;
    --bg:#efe4cd; --surface:#ffffff; --text:#0c0c1e; --text2:#463b2c; --text3:#5c5346;
  }
  [data-theme="dark"] {
    --bg:#181410; --surface:#241e18; --text:#f5ede2; --text2:#cbbba9; --text3:#9c8b78;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Figtree',Arial,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem; transition:background .3s,color .3s;
  }
  .wrap { max-width:480px; }
  .logo {
    font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700;
    color:var(--red); letter-spacing:-0.02em; margin-bottom:3rem;
    display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
  }
  .logo sup { font-size:0.45em; color:var(--text3); font-weight:400; font-family:'Figtree',sans-serif; }
  .num {
    font-family:'Playfair Display',serif; font-size:8rem; font-weight:700; line-height:1;
    color:var(--red); opacity:0.15; user-select:none;
  }
  h1 { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:700; margin-bottom:0.75rem; margin-top:-1.5rem; }
  p { color:var(--text2); font-size:0.95rem; line-height:1.6; margin-bottom:2rem; }
  .btn {
    display:inline-block; background:var(--red); color:#fff; padding:0.75rem 2rem;
    border-radius:99px; font-weight:700; font-size:0.95rem; text-decoration:none;
    box-shadow:0 4px 20px rgba(192,57,43,0.35); transition:background .2s,transform .2s;
  }
  .btn:hover { background:var(--red-dark); transform:translateY(-1px); }
  .link { display:block; margin-top:1rem; color:var(--text3); font-size:0.85rem; text-decoration:none; }
  .link:hover { color:var(--red); }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-10px) rotate(4deg)} }
  .yarn { animation:float 3s ease-in-out infinite; display:inline-block; font-size:4rem; margin-bottom:1rem; }
</style>
</head>
<body>

</body>
</html>
